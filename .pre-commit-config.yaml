default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.9.0
    hooks:
      - id: betterleaks
  - repo: local
    hooks:
      - id: validate-plugin
        name: Validate plugin manifests and skills
        entry: just validate
        language: system
        pass_filenames: false
        files: ^(plugin\.json|\.claude-plugin/|\.agents/|skills/)
      - id: no-pii
        name: Block identifying info (paths, emails, names)
        entry: scripts/check-pii.sh
        language: system
        types: [text]
        exclude: ^scripts/check-pii\.sh$
      - id: no-pii-author
        name: Require noreply commit email
        entry: scripts/check-pii.sh --author
        language: system
        pass_filenames: false
        always_run: true
      - id: no-pii-commit-msg
        name: Block identifying info in commit message
        entry: scripts/check-pii.sh --commit-msg
        language: system
        stages: [commit-msg]
